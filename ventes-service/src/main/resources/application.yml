server:
  port: 8082

spring:
  application:
    name: ventes-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/ventes_db}
    username: ${SPRING_DATASOURCE_USERNAME:erp}
    password: ${SPRING_DATASOURCE_PASSWORD:erp_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:erp}
    password: ${SPRING_RABBITMQ_PASSWORD:erp_secret}

stock:
  service:
    url: ${STOCK_SERVICE_URL:http://localhost:8081}

erp:
  rabbitmq:
    exchange: erp.exchange
    routing-key:
      commande-created: commande.created

rmi:
  enabled: ${RMI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
