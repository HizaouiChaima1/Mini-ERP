server:
  port: 8081

spring:
  application:
    name: stock-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/stock_db}
    username: ${SPRING_DATASOURCE_USERNAME:erp}
    password: ${SPRING_DATASOURCE_PASSWORD:erp_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:erp}
    password: ${SPRING_RABBITMQ_PASSWORD:erp_secret}

erp:
  rabbitmq:
    exchange: erp.exchange
    routing-key:
      stock-updated: stock.updated
      stock-alert: stock.alert

rmi:
  enabled: ${RMI_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
