server:
  port: 8083

spring:
  application:
    name: finance-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/finance_db}
    username: ${SPRING_DATASOURCE_USERNAME:erp}
    password: ${SPRING_DATASOURCE_PASSWORD:erp_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:erp}
    password: ${SPRING_RABBITMQ_PASSWORD:erp_secret}

rmi:
  enabled: ${RMI_ENABLED:true}
  hostname: ${RMI_PUBLIC_HOSTNAME:localhost}
  registry-port: 1101
  service-name: FinanceService
  clients:
    stock: ${RMI_STOCK_URL:rmi://localhost:1099/StockService}
    ventes: ${RMI_VENTES_URL:rmi://localhost:1100/VentesService}

management:
  endpoints:
    web:
      exposure:
        include: health,info
